name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "GenshinRouteAssistant_0.1.1_source_fixed.zip" -DestinationPath "source" -Force
          $app = Get-ChildItem "source" -Filter "app.py" -Recurse | Select-Object -First 1
          if (-not $app) {
            throw "app.py not found in source ZIP"
          }
          "PROJECT_DIR=$($app.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "$env:PROJECT_DIR/requirements.txt"
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          pyinstaller --noconfirm --clean --windowed --name GenshinRouteAssistant app.py

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR/dist/GenshinRouteAssistant/*" -DestinationPath "$env:GITHUB_WORKSPACE/GenshinRouteAssistant-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinRouteAssistant-Windows
          path: GenshinRouteAssistant-Windows.zip
          retention-days: 14
