权限:
内容: 读

工作:
建立:
连续的: Windows-最新

步骤:
      - 姓名: 签出存储库
uses: 操作/结帐@v4

      - 姓名: 提取源ZIP
壳: pwsh
跑: |
展开-存档-文本路径"GensshinRouteAssistant_0.1.1_source_fixed。拉链"-目标路径“源”-力
没有任何的"来源"-过滤器"app.py"-Recurse|
选择-对象-第一个1
if(！$app){
抛出"ZIP中找不到app.py"
          }
"PROJECT_DIR=$($app.Directory.FullName)"|
out-file$env:GITHUB_ENV-append

      - 姓名: 设置python
uses: actions/setup-python@v5
和……一起:
python版: "3.12"

      - 姓名: 安装相依性
壳: pwsh
跑: |
Python-m pip安装--升级pip
PIP安装-r"$env:PROJECT_DIR/requirements.txt"
PIP安装PyInstaller

      - 姓名: 组建EXE
壳: pwsh
跑: |
设置位置"$env:PROJECT_DIR"
PyInstaller-noconfirm-clean-windowd'
现在,我们可以在这个地方.

      - 姓名: 软件包应用程序
壳: pwsh
跑: |
压缩档案'
"$env:PROJECT_DIR/dist/GenshinRouteAssistant/*"'
"$env:GITHUB_WORKSPACE/GenshinRouteAssistant-Windows。拉链"'
            -Force

      - 姓名: 上传组建成品
uses: 操作/上载工件@v4
